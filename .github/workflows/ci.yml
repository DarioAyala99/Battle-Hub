# CI: en cada push y pull request corre los tests y verifica que el proyecto compile.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test-y-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests unitarios (Vitest)
        run: npm test

      - name: Build de producción
        run: npm run build
        env:
          # En CI alcanza con valores de prueba: solo se verifica que compile
          VITE_SUPABASE_URL: https://ejemplo.supabase.co
          VITE_SUPABASE_ANON_KEY: clave-de-prueba
