# CD: al hacer push a main, testea, compila y publica en GitHub Pages.
# Requisito: Settings -> Pages -> Source: "GitHub Actions".
name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos pushes seguidos, se cancela el deploy viejo
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests unitarios
        run: npm test

      - name: Build de producción
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # La app se sirve en https://<usuario>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Subir el build como artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
